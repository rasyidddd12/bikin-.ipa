name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - run: |
          xcodebuild -project SyidSearch.xcodeproj -scheme SyidSearch -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - run: |
          mkdir Payload && cp -r build/Build/Products/Release-iphoneos/SyidSearch.app Payload/
          zip -qr SyidSearch.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SyidSearch-ipa
          path: SyidSearch.ipa
